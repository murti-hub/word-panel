(function(){try{fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(v){v=String(v||"").trim();
  if(v&&v!==ALEV_VER&&String(location.search).indexOf("v="+encodeURIComponent(v))<0){location.replace(location.pathname+"?v="+encodeURIComponent(v)+"&t="+Date.now());}}).catch(function(){});}catch(e){}})();

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#FBF7F2;--paper:#FFFFFF;--ink:#231A14;--soft:#7A6A5E;--line:#EADFD3;--acc:#E8590C;--gold:#F59F00;--ok:#2F7D3A}
@media (prefers-color-scheme:dark){:root{--bg:#1A1512;--paper:#241D18;--ink:#F3EAE2;--soft:#B2A294;--line:#3A2F27;--acc:#FF8A3D;--gold:#FFC53D;--ok:#7CCB86}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
.w{padding:14px 14px 20px;max-width:420px;margin:0 auto}
.stage{position:relative;height:210px;display:flex;align-items:flex-end;justify-content:center}
.fl{width:150px;height:190px;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s}
.fl .f1{animation:fk1 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.fl .f2{animation:fk2 .8s ease-in-out infinite alternate;transform-origin:50% 100%}
.fl .f3{animation:fk1 .6s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fk1{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(1.03,.96) skewX(2deg)}100%{transform:scale(.97,1.05) skewX(-2deg)}}
@keyframes fk2{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.05,.94) skewX(3deg)}}
.cold .fl{filter:grayscale(.85) opacity(.5)}
.cold .fl .f1,.cold .fl .f2,.cold .fl .f3{animation-play-state:paused}
.combo{position:absolute;left:0;right:0;bottom:22px;text-align:center;pointer-events:none}
.combo b{display:block;font:800 40px/1 -apple-system,system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(120,30,0,.55)}
.combo span{font:800 10.5px/1 -apple-system,system-ui,sans-serif;letter-spacing:.2em;color:#fff;text-shadow:0 1px 4px rgba(120,30,0,.6)}
.cold .combo b,.cold .combo span{color:var(--soft);text-shadow:none}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.msg{min-height:44px;text-align:center;font:700 16px/1.35 Georgia,serif;margin:6px 4px 4px;color:var(--ink)}
.msg.flash{animation:fade .5s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .9s linear}
.tl{font-size:11.5px;color:var(--soft);text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.c{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.c .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.c .v{font:800 22px/1.2 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.c .s{font-size:12px;color:var(--soft)}
.c.wide{grid-column:1/3}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.bar.done i{background:var(--ok)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--soft)}
.foot button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.set{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:none;gap:8px;flex-direction:column}
.set.on{display:flex}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.set input,.set select{width:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;font-size:13px}
.err{background:#FFF1E6;color:#8A3B00;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}
@media (prefers-color-scheme:dark){.err{background:#3A2312;color:#FFC59A}}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:99px;padding:6px 8px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view{display:none}.view.on{display:block}
.pad{padding:12px 12px 24px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--soft);font-size:13px}
.empty b{display:block;color:var(--ink);font:700 16px Georgia,serif;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.q{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:99px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ph .h{display:flex;align-items:baseline;gap:6px}
.ph .h b{font:600 15.5px Georgia,serif;cursor:pointer;flex:1;min-width:0}
.ph .h i{font-style:normal;color:var(--soft);font-size:12px}
.ph .fn{font-size:12.5px;color:var(--soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph.open .fn{display:block}
.ph .more{display:none;margin-top:6px;font-size:12.5px}.ph.open .more{display:block}
.ph .ex{font:13px/1.45 Georgia,serif;border-left:3px solid var(--gold);padding:3px 8px;margin:5px 0;background:var(--bg);border-radius:0 6px 6px 0}
.ph .ex small{display:block;font:11px -apple-system,system-ui,sans-serif;color:var(--soft)}
.ph .fr{font:italic 13px Georgia,serif;background:var(--bg);border-radius:6px;padding:3px 7px;margin:4px 0}
.ins{border:0;background:var(--acc);color:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none}
.lk{border:0;background:none;color:var(--acc);font-size:11.5px;font-weight:700;cursor:pointer;padding:0}
.sel{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:6px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:13.5px/1.5 Georgia,serif;white-space:pre-wrap}
.qt{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.qt p{margin:0;font:13.5px/1.5 Georgia,serif}
.qt .m{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--soft)}
.qt .m span{flex:1;min-width:0}
.cell{font-size:12.5px;margin-top:4px}.cell b{display:block;font-size:11px;color:var(--soft)}
.hint{font-size:11.5px;color:var(--soft);margin-top:10px}
.path{font-size:12px;color:var(--soft);margin-bottom:4px}
.kids{display:flex;flex-wrap:wrap;gap:5px}
.kids button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;text-align:left}
.gbar{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--soft);border-bottom:1px solid var(--line);background:var(--bg)}
.gbar span{flex:1;min-width:0}
.gbar .btn{padding:3px 8px;font-size:11.5px}
.gbar.hide{display:none}
.hv{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.hv .t{font:13.5px/1.5 Georgia,serif;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.hv.open .t{display:block}
.hv .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--soft)}
.hv .m .no{font-weight:800;color:var(--acc)}
.hv .m .sp{flex:1}
.hv.done{opacity:.6}
.ph .h{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;row-gap:1px;align-items:start}
.ph .h b{grid-column:1;overflow-wrap:anywhere}
.ph .h i{grid-column:1;grid-row:2;font-size:12px;line-height:1.35}
.ph .h .ins{grid-column:2;grid-row:1 / span 2;align-self:start}
.tabs{gap:3px;padding:6px 6px}
.tabs button{padding:5px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qt .m{flex-wrap:wrap}
.hv .t,.qt p,.note,.ph .ex{overflow-wrap:anywhere}
@media (max-width:300px){
  body{font-size:13px}
  .pad{padding:10px 8px 20px}
  .tabs button{font-size:11px}
  .ph .h b{font-size:14px}
  .ph .fn,.cell,.hv .m,.qt .m{font-size:11.5px}
  .hv .t,.qt p,.note{font-size:12.5px}
  .c .v{font-size:19px}.c{padding:8px 9px}
  .stage{height:180px}.fl{width:125px;height:160px}
  .gbar{padding:5px 8px}
}
.hv .th{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;margin-top:6px}
.hv .th img{width:100%;height:70px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.hv .th img:only-child{height:auto;max-height:180px}
.thx{font-size:11.5px;color:var(--soft)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:10px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:6px}
#lb button{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#111;font-size:18px;cursor:pointer}
</style>
</head>
<body>

      <defs>
        <radialGradient id="g1" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#E8590C"/></radialGradient>
        <radialGradient id="g2" cx="50%" cy="85%" r="70%"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FAB005"/></radialGradient>
        <radialGradient id="g3" cx="50%" cy="85%" r="70%"><stop offset="0" stop-color="#FFFFFF" id="c3a"/><stop offset="1" stop-color="#FFF3BF" id="c3b"/></radialGradient>
      </defs>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var KEY="alev-word-v1", S={days:{},goal:300,win:600,best:0,snd:2,vol:60};
try{var o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)S=Object.assign(S,o);}catch(e){}
if(!S.winV2){if(S.win<120)S.win=600;S.winV2=1;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function day(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var combo=0,sessW=0,sessS=0,last=0,prev=null,lastMsgAt=0,running=false;
function wc(t){var m=String(t||"").match(/[^\s​]+/g);return m?m.length:0;}
function sents(t){t=String(t||"").replace(/\be\.g\./gi,"eg·").replace(/\bi\.e\./gi,"ie·").replace(/\b(et al|cf|vs|pp?|no|vol|eds?|ch|fig|Dr|Mr|Mrs|Ms|St|ca|approx)\./gi,"$1·").replace(/(^|[\s(])([A-ZÇĞİÖŞÜ])\.(?=\s)/g,"$1$2·");
  var m=t.match(/[^.!?…]+[.!?…]+["'”’)\]]*(?=\s|$)/g)||[];return m.filter(function(x){return wc(x)>=4;}).length;}
function same(a,b){if(!a||!b)return !a&&wc(b)<=20||!b&&wc(a)<=20;var k=Math.min(18,a.length,b.length);return k>0&&a.slice(0,k)===b.slice(0,k);}
function streak(){var n=0,d=new Date();if((S.days[day(d)]||0)<S.goal)d.setDate(d.getDate()-1);for(var i=0;i<3650;i++){if((S.days[day(d)]||0)>=S.goal){n++;d.setDate(d.getDate()-1);}else break;}return n;}
var MS={1:"Başladın 🔥",3:"Isınıyorsun…",5:"5 cümle üst üste! İyi gidiyorsun",8:"Akış geldi, bırakma",10:"Kombo x10! Durma 🔥",15:"Harika ritim, x15",20:"Mavi alev! x20 💙",25:"Bu iş oluyor, x25",30:"Efsane! x30"};
var SMALL=["Bir cümle daha ✓","Güzel","Devam","Akıyor","Tamam, sıradaki","İyi","Bir tane daha"];
function say(t){var m=$("msg");m.textContent=t;m.classList.remove("flash");void m.offsetWidth;m.classList.add("flash");lastMsgAt=Date.now();}
function bump(){var c=$("cn");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");}
/* --- Ses: Web Audio ile üretilen özgün efektler + sistem sesiyle spiker --- */
var AC=null;
/* Ses motoru boşta kalınca uyusun: Word'ün belleğini ve işlemcisini meşgul etmesin */
var acIdle=null;function acSleep(){}
function curView(){return window.__view||"alev";}
var KEEP=null;function keepAlive(){try{if(KEEP||!AC||AC.state!=="running")return;var o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.00001;o.frequency.value=30;o.connect(g);g.connect(AC.destination);o.start();KEEP=o;}catch(e){}}
var SLOG={st:"",at:0,ok:null,why:""};function slog(ok,why){SLOG.at=Date.now();SLOG.ok=ok;SLOG.why=why||"";SLOG.st=AC?AC.state:"yok";var e=$("sndDbg");if(e)e.textContent=sdbg();}
function sdbg(){if(!SLOG.at)return "Ses durumu: "+(AC?AC.state:"motor kapalı")+" · henüz çalmadı";return "Son ses "+new Date(SLOG.at).toLocaleTimeString("tr-TR")+" · "+(SLOG.ok?"çaldı ✓":"çalamadı ✗")+(SLOG.why?" ("+SLOG.why+")":"")+" · motor: "+SLOG.st+" · sekme: "+curView();}
function ac(){try{if(!sm()&&!custom())return null;if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==="suspended")AC.resume();}catch(e){return null;}return AC;}
document.addEventListener("pointerdown",function(){if(!AC||AC.state!=="running"){var c=ac();if(c){acSleep();try{c.resume().then(keepAlive,function(){});}catch(e){}}}else keepAlive();if(custom()&&CBUF===null)cbuf();sndHint();});
var acOk=false;
function sndHint(){var e=$("sndh");if(!e)return;if(AC&&AC.state==="running")acOk=true;e.hidden=!(sm()&&!acOk);}
function tone(f,t0,d,type,g,again){var c=ac();if(!c){slog(false,"ses motoru yok");return;}if(c.state==="running"){acOk=true;keepAlive();}if(c.state!=="running"){if(again){slog(false,"motor "+c.state+"; panele bir dokun");return;}try{c.resume().then(function(){tone(f,t0,d,type,g,1);},function(e){slog(false,"uyandırılamadı");});}catch(e){slog(false,"uyandırılamadı");}return;}if(t0===0)slog(true);var o=c.createOscillator(),v=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,c.currentTime+t0);
  var L=(S.vol==null?60:S.vol)/100*(g||0.18);v.gain.setValueAtTime(0.0001,c.currentTime+t0);v.gain.exponentialRampToValueAtTime(Math.max(L,0.0002),c.currentTime+t0+0.012);v.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);
  o.connect(v);v.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.02);}
function sm(){return S.snd==null?1:S.snd;}
var CK="alev-snd-custom",CA=null;
var CBUF=null,CBUSY=false;
function custom(){if(CA!==null)return CA;try{var d=localStorage.getItem(CK);CA=d?{url:d}:false;}catch(e){CA=false;}return CA;}
/* Word panelinde (Safari motoru) <audio> yazarken çalmaya izin verilmiyor; sesi Web Audio'ya çözüp oradan çalıyoruz */
function cbuf(){var a=custom(),c=ac();if(!a||!c||CBUF||CBUSY)return;CBUSY=true;
  try{var b64=a.url.split(",")[1],bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var done=function(buf){CBUF=buf;CBUSY=false;},fail=function(){CBUSY=false;CBUF=false;};
    var pr=c.decodeAudioData(u.buffer,done,fail);if(pr&&pr.then)pr.then(done,fail);}catch(e){CBUSY=false;CBUF=false;}}
function customWhen(n){var w=S.sndWhen||"m";return w==="all"||(w==="5"&&n%5===0)||(w==="10"&&n>=10&&n%10===0)||(w==="m"&&(MS[n]||(n>30&&n%10===0))&&n>1);}
var CEL=null;
function playCustom(){var a=custom();if(!a)return false;var c=ac();
  if(c&&CBUF&&c.state!=="running"){try{var tried=playCustom.tried;if(tried){playCustom.tried=0;slog(false,"motor "+c.state+"; Word sesi açtırmadı");return false;}playCustom.tried=1;c.resume().then(function(){playCustom();},function(){playCustom.tried=0;slog(false,"motor uyandırılamadı");});return true;}catch(e){}}
  playCustom.tried=0;
  if(c&&CBUF){if(c.state==="running")slog(true,"kendi sesin");try{var src=c.createBufferSource(),g=c.createGain();src.buffer=CBUF;g.gain.value=(S.vol==null?60:S.vol)/100;src.connect(g);g.connect(c.destination);src.start();return true;}catch(e){}}
  if(CBUF===null)cbuf();
  try{if(!CEL){CEL=new Audio(a.url);CEL.addEventListener("ended",function(){try{CEL.removeAttribute("src");CEL.load();}catch(e){}CEL=null;});}CEL.volume=(S.vol==null?60:S.vol)/100;var p=CEL.play();if(p&&p.catch)p.catch(function(){});}catch(e){return false;}return true;}
function sfx(n){if(!sm())return;if(custom()&&customWhen(n)){playCustom();return;}var base=330*Math.pow(2,Math.min(n,24)/24);
  if(n>=10&&n%5===0){[0,4,7,12,16,19,24].forEach(function(st,i){tone(base*Math.pow(2,st/12),i*0.06,0.22,"square",0.16);});tone(base*2,0.45,0.5,"sawtooth",0.12);tone(base*3,0.45,0.5,"triangle",0.12);}
  else if(MS[n]){[0,7,12].forEach(function(st,i){tone(base*Math.pow(2,st/12),i*0.07,0.16,"square");});}
  else{tone(base*1.5,0,0.09,"triangle",0.2);tone(base*2,0.06,0.12,"triangle",0.2);}
  if(sm()>=2&&(n>=3&&(MS[n]||n%5===0))&&window.speechSynthesis){try{var w=n>=20?"Ultra combo! "+n+" hits!":n>=10?n+" hit combo!":"Combo! "+n+"!";var u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=1.05;u.pitch=0.7;u.volume=(S.vol==null?60:S.vol)/100;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang);});var pick=vs.find(function(v){return /Daniel|Fred|Alex|Ralph|Arthur/i.test(v.name);})||vs[0];if(pick)u.voice=pick;speechSynthesis.cancel();setTimeout(function(){speechSynthesis.speak(u);},380);}catch(e){}}}
function sfxEnd(n){if(!sm()||n<3)return;[12,7,3,0].forEach(function(st,i){tone(262*Math.pow(2,st/12),i*0.09,0.16,"triangle",0.15);});}
function onSentence(){combo++;sfx(combo);sessS++;bump();if(MS[combo])say(MS[combo]);else if(combo>30&&combo%10===0)say("x"+combo+"! İnanılmaz seri");else if(Date.now()-lastMsgAt>8000)say(SMALL[Math.floor(Math.random()*SMALL.length)]);if(combo>S.best){S.best=combo;save();}}
function onWords(n){sessW+=n;var k=day();var before=S.days[k]||0;S.days[k]=before+n;if(before<S.goal&&S.days[k]>=S.goal)say("Günlük hedef tamam! 🎉 "+S.goal+" kelime");save();}
function endCombo(){sfxEnd(combo);if(combo>=3)say("Kombo bitti: x"+combo+(combo>=S.best?" · rekor!":"")+". Yeni cümleyle yeniden yak.");else if(combo>0)say("Alev söndü, bir cümleyle yeniden yak.");combo=0;}
function paint(){
  var now=Date.now(),left=last?Math.max(0,S.win*1000-(now-last)):0;
  if(combo>0&&last&&left===0)endCombo();
  var tbn=document.querySelector('#tabs [data-v="alev"]');if(tbn){var lbl=combo?"🔥 x"+combo:"🔥 Alev";if(tbn.textContent!==lbl)tbn.textContent=lbl;}
  if(curView()!=="alev"&&!paint.force)return; paint.force=false;
  var heat=combo?Math.min(1,0.25+combo/20):0;
  $("w").classList.toggle("cold",!combo);
  $("fl").style.transform="scale("+(0.55+heat*0.55).toFixed(3)+")";
  var blue=combo>=20;$("c3a").setAttribute("stop-color",blue?"#E7F5FF":"#FFFFFF");$("c3b").setAttribute("stop-color",blue?"#74C0FC":"#FFF3BF");
  $("cn").textContent=combo?"x"+combo:"0";
  $("tb").style.width=(combo?left/(S.win*1000)*100:0)+"%";
  $("tl").textContent=combo?"Kombo "+(function(x){var m=Math.floor(x/60),sec=x%60;return m?m+" dk "+(sec<10?"0":"")+sec+" sn":sec+" sn";})(Math.ceil(left/1000))+" içinde yeni cümle bekliyor":"Her bitirdiğin cümle komboyu büyütür.";
  $("sw").textContent=sessW;$("ss").textContent="kelime · "+sessS+" cümle";
  var t=S.days[day()]||0;$("tw").firstChild.nodeValue=t+" ";$("tg").textContent="/ "+S.goal;$("tbi").style.width=Math.min(100,t/S.goal*100)+"%";$("tbar").classList.toggle("done",t>=S.goal);
  var s=streak();$("st").textContent=s;$("sts").textContent=s?"gün üst üste hedef 🔥":"gün · hedefi tuttur, seri başlasın";
  $("bc").textContent=S.best;
}
window.alevPaint=function(){paint.force=true;paint();};
function handle(text,pt){
  var w=wc(text),s=sents(text),now=Date.now(),hi=s;
  function got(n){for(var i=0;i<Math.min(n,3);i++)onSentence();last=now;}
  var entered=prev&&prev.t&&pt!=null&&same(prev.t,pt)&&!(text&&same(prev.t,text));
  if(prev&&!entered&&same(prev.t,text)){
    var dw=w-prev.w;hi=Math.max(prev.hi,s);
    if(dw>60){say("Yapıştırma sayılmadı 🙂");}
    else{ if(dw>0)onWords(dw); if(s>prev.hi)got(s-prev.hi); }
  }else if(entered){
    /* Enter'a basıp yeni paragrafa geçtin: önceki paragrafın son hâlini say */
    var pw=wc(pt)-prev.w,ps=sents(pt);
    if(pw<=60){ if(pw>0)onWords(pw); if(ps>prev.hi)got(ps-prev.hi); }
  }
  prev={t:text,w:w,s:s,hi:hi};
}
var lastPoll=0,pollT=null;
/* Word'ü yormamak için: yazarken değil, yazmaya ara verince (1,2 sn) bak */
function soon(){clearTimeout(pollT);pollT=setTimeout(poll,1200);}
function poll(){
  if(running)return;running=true;
  lastPoll=Date.now();
  Word.run(function(ctx){var p=ctx.document.getSelection().paragraphs.getFirst(),q=p.getPreviousOrNullObject();p.load("text");q.load("text");
      return ctx.sync().then(function(){handle(p.text,q.isNullObject?null:q.text);});})
    .catch(function(){return Word.run(function(ctx){var p=ctx.document.getSelection().paragraphs.getFirstOrNullObject();p.load("text");return ctx.sync().then(function(){if(!p.isNullObject)handle(p.text,null);});});})
    .then(function(){running=false;$("err").style.display="none";$("st2").textContent="Yazdıklarını izliyor · metin hiçbir yere gönderilmez";},function(e){running=false;$("st2").textContent="Belge okunamadı";});
}
function docCount(){Word.run(function(ctx){var b=ctx.document.body;b.load("text");return ctx.sync().then(function(){$("dw").textContent=wc(b.text).toLocaleString("tr-TR");});}).catch(function(){});}
$("sb").onclick=function(){var s=$("set");s.classList.toggle("on");$("goal").value=S.goal;$("win").value=String(S.win);$("snd").value=String(S.snd==null?1:S.snd);sndUI();$("sndDbg").textContent=sdbg();$("vol").value=String(S.vol==null?60:S.vol);};
$("goal").onchange=function(){var v=parseInt(this.value,10);if(v>=50){S.goal=v;save();paint();}};
$("snd").onchange=function(){S.snd=parseInt(this.value,10)||0;save();ac();};
$("vol").oninput=function(){S.vol=parseInt(this.value,10);save();};
$("sndTry").onclick=function(){ac();if(custom()){playCustom();return;}var o=S.snd;if(!sm())S.snd=2;sfx(10);S.snd=o;};
function sndUI(){var c=!!custom();$("sndDel").hidden=!c;$("sndWhenL").hidden=!c;$("sndPick").textContent=c?"Değiştir":"Dosya seç";$("sndWhen").value=S.sndWhen||"m";}
$("sndPick").onclick=function(){$("sndFile").click();};
$("sndFile").onchange=function(){var f=this.files&&this.files[0];if(!f)return;if(f.size>1500000){say("Ses dosyası çok büyük; 1-2 saniyelik kısa bir parça seç (en fazla 1,5 MB).");return;}
  var r=new FileReader();r.onload=function(){try{localStorage.setItem(CK,r.result);CA=null;CBUF=null;cbuf();sndUI();ac();playCustom();say("Sesin eklendi 🔊");}catch(e){say("Ses kaydedilemedi, daha kısa bir dosya dene.");}};r.readAsDataURL(f);this.value="";};
$("sndDel").onclick=function(){try{localStorage.removeItem(CK);}catch(e){}CA=null;CBUF=null;sndUI();};
$("sndWhen").onchange=function(){S.sndWhen=this.value;save();};
$("win").onchange=function(){S.win=parseInt(this.value,10)||600;save();paint();};
$("rst").onclick=function(){S.days[day()]=0;save();paint();};
setInterval(paint,1000);paint();setTimeout(sndHint,500);
Office.onReady(function(info){
  if(info.host!==Office.HostType.Word){$("err").style.display="block";$("err").textContent="Bu panel Word içinde çalışır.";return;}
  if(!Office.context.requirements.isSetSupported("WordApi","1.3")){$("err").style.display="block";$("err").textContent="Word sürümün bu paneli desteklemiyor; Word'ü güncelle.";return;}
  poll();var evOK=false;
  try{Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged,soon,function(r){evOK=r.status==="succeeded";});}catch(e){}
  setInterval(function(){if(document.hidden)return;if(!evOK||Date.now()-lastPoll>15000)poll();},evOK?15000:3000);
  docCount();setInterval(function(){if(!document.hidden&&curView()==="alev")docCount();},300000);
});
})();

<script>
/* ---------- sekmeler, veri yükleme, Bağlam ve Dal ---------- */
(function(){
var $=function(id){return document.getElementById(id);};
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fold(x){return String(x||"").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");}
var KB="alev-data-baglam",KA="alev-data-agac",KV="alev-ui";
var B=null,A=null,UI={v:"alev",cat:"",pj:"",node:""};
try{B=JSON.parse(localStorage.getItem(KB)||"null");}catch(e){} try{A=JSON.parse(localStorage.getItem(KA)||"null");}catch(e){} try{UI=Object.assign(UI,JSON.parse(localStorage.getItem(KV)||"{}"));}catch(e){}
function saveUI(){try{localStorage.setItem(KV,JSON.stringify(UI));}catch(e){}}
function ago(t){if(!t)return"";var d=new Date(t);return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}
/* --- Word'e ekleme --- */
function insert(text,btn){ if(!window.Word){return;} Word.run(function(ctx){ctx.document.getSelection().insertText(text,"Replace");return ctx.sync();}).then(function(){ if(btn){var o=btn.textContent;btn.textContent="✓";setTimeout(function(){btn.textContent=o;},1000);} },function(){ if(btn) btn.textContent="olmadı"; }); }
function copy(text,btn){ try{navigator.clipboard.writeText(text).then(function(){ if(btn){var o=btn.textContent;btn.textContent="kopyalandı";setTimeout(function(){btn.textContent=o;},1000);} });}catch(e){} }
/* --- veri dosyası --- */
var want="";
function pick(kind){want=kind;$("fileIn").value="";$("fileIn").click();}
$("fileIn").addEventListener("change",function(){var f=this.files&&this.files[0];if(!f)return;f.text().then(function(t){var o;try{o=JSON.parse(t);}catch(e){alert("Bu dosya okunamadı (JSON değil).");return;}
  if(take(o)){show(o.app==="havuz-word"?"havuz":(o.app==="baglam"||o.app==="baglam-word")?"baglam":"dal");}
  else alert(want==="baglam"?"Bu bir Bağlam yedeği gibi görünmüyor. Bağlam → Kaydettiklerim → “Yedek indir (.json)” dosyasını seç.":"Bu bir Yazı ağacı yedeği gibi görünmüyor. Yazı ağacı → Yedek → “Yedeği indir (.json)” dosyasını seç.");
});});
var KH="alev-data-havuz",H=null;try{H=JSON.parse(localStorage.getItem(KH)||"null");}catch(e){}
function take(o,src){ if(!o) return false;
  if(o.app==="baglam"&&Array.isArray(o.saved)){B=packB(o);}
  else if(o.app==="baglam-word"&&Array.isArray(o.list)){B=o;}
  else if(o.app==="agac-word"&&Array.isArray(o.projects)){A=o;}
  else if(o.root&&(o.projects||o.lit)){A=packA(o);}
  else if(o.app==="havuz-word"&&Array.isArray(o.items)){H=o;}
  else return false;
  var x=o.app==="havuz-word"?H:(o.app==="baglam"||o.app==="baglam-word")?B:A; x.src=src||"dosya"; x.loaded=Date.now();
  try{localStorage.setItem(o.app==="havuz-word"?KH:(o.app==="baglam"||o.app==="baglam-word")?KB:KA,JSON.stringify(x));}catch(e){}
  return true; }
function packB(o){var g={},order=[];o.saved.forEach(function(z){var k=String(z.p||"").toLowerCase();if(!k)return;if(!g[k]){g[k]={p:z.p,ex:[],n:0};order.push(k);}g[k].n++;if(g[k].ex.length<4)g[k].ex.push({s:z.s,src:z.src||""});});
  var info=o.info||{};return{at:Date.now(),list:order.map(function(k){var i=info[k]||{};return{p:g[k].p,n:g[k].n,ex:g[k].ex,tr:i.tr||"",fn:i.fn||"",cat:i.cat||"",move:i.move||"",frame:i.frame||"",before:i.before||"",after:i.after||"",alts:i.alts||[]};})};}
function packA(o){var cols=function(lit){var m={};((lit&&lit.cols)||[]).forEach(function(c){m[c.id]=c.name;});return m;};
  function proj(id,name,root,lit){var nodes=[],cm=cols(lit);(function walk(n,path,d){var t=String(n.title||"").trim()||"Adsız dal";nodes.push({id:n.id,t:t,path:path.join(" › "),d:d,note:n.note||"",st:n.status||"",q:(n.quotes||[]).map(function(q){return{q:q.q,cite:q.cite||"",comment:q.comment||""};}),k:(n.children||[]).map(function(c){return c.id;})});(n.children||[]).forEach(function(c){walk(c,path.concat([t]),d+1);});})(root,[],0);
    var rows=((lit&&lit.rows)||[]).filter(function(r){return r.status==="done";}).map(function(r){var cells=[];var c=r.cells||{};for(var k in c){var v=c[k]&&(c[k].v||c[k]);if(v&&typeof v==="string")cells.push({n:cm[k]||k,v:v});}return{id:r.id,a:r.author||"",y:r.year||"",t:r.title||"",kind:r.kind||"",venue:r.venue||"",br:r.br||[],cells:cells,url:r.url||""};});
    return{id:id,name:name,nodes:nodes,rows:rows};}
  var ps=[];(o.projects||[]).forEach(function(p){if(p.id===o.cur)ps.push(proj(p.id,p.name,o.root,o.lit));else if(p.root)ps.push(proj(p.id,p.name,p.root,p.lit));});
  if(!ps.length)ps.push(proj("p","Proje",o.root,o.lit));return{at:Date.now(),cur:o.cur,projects:ps};}
function loadBox(kind){var nm={baglam:"Bağlam",dal:"Yazı ağacı",havuz:"Havuz"}[kind];return '<div class="empty"><b>'+nm+' verisi henüz gelmedi</b>'+(G.ok()?"Google Drive'a bağlısın. "+nm+"'ı bir kere açınca veri dosyasını Drive'a yazar, panel birkaç dakika içinde kendisi alır.":"Üstteki <b>Google'a bağlan</b> ile bağlanırsan "+nm+"'dan veriler kendiliğinden gelir.")+'<div style="margin-top:10px"><button class="btn pri" data-gsync="1">'+(G.ok()?"Şimdi kontrol et":"Google'a bağlan")+'</button> <button class="btn" data-load="'+kind+'">Dosyadan yükle</button></div></div>';}
function srcLine(x,kind){return (x.src==="drive"?"☁ Drive'dan":"dosyadan")+" · "+ago(x.at||x.loaded)+' · <button class="lk" data-load="'+kind+'">Dosyadan yükle</button>';}
/* --- Bağlam görünümü --- */
var bq="";
function renderB(){var el=$("v-baglam");if(!B){el.innerHTML=loadBox("baglam");return;}
  var cats=[];B.list.forEach(function(x){if(x.cat&&cats.indexOf(x.cat)<0)cats.push(x.cat);});
  var f=fold(bq.trim());var L=B.list.filter(function(x){if(UI.cat&&x.cat!==UI.cat)return false;if(!f)return true;var hay=fold([x.p,x.tr,x.fn,x.move,x.cat,(x.roles||[]).join(" "),(x.alts||[]).join(" ")].join(" "));if(hay.indexOf(f)>=0)return true;
    /* ek farkına takılmasın: örneğin ~ örnek, contrasting ~ contrast */
    var ws=f.split(/\s+/).filter(function(w){return w.length>2;});return ws.length>0&&ws.every(function(w){return hay.indexOf(w.slice(0,Math.max(4,w.length-3)))>=0;});});
  /* aynı aileden ifadeler (stress upon / stress upon the fact that) yan yana */
  var byP={};L.forEach(function(x){byP[x.p]=x;});var L2=[],done={};L.forEach(function(x){if(done[x.p])return;if(x.fam&&byP[x.fam]&&!done[x.fam])return;L2.push(x);done[x.p]=1;L.forEach(function(y){if(y.fam===x.p&&!done[y.p]){L2.push(y);done[y.p]=1;}});});L.forEach(function(x){if(!done[x.p]){L2.push(x);done[x.p]=1;}});L=L2;
  var head=el.querySelector("#bq")?null:'<input class="q" id="bq" placeholder="Ara: ifade, Türkçe anlam ya da rol (örneğin, karşıtlık…)" value="'+esc(bq)+'"><div class="chips" id="bcats"></div><div id="blist"></div><div class="hint" id="bhint"></div>';
  if(head)el.innerHTML=head;
  $("bcats").innerHTML='<button data-cat="" aria-pressed="'+(!UI.cat)+'">Hepsi</button>'+cats.map(function(c){return'<button data-cat="'+esc(c)+'" aria-pressed="'+(UI.cat===c)+'">'+esc(c)+'</button>';}).join("");
  $("blist").innerHTML=L.slice(0,150).map(function(x,i){var id=B.list.indexOf(x);return'<div class="ph" data-i="'+id+'"'+(x.fam?' style="margin-left:14px;border-left:2px solid var(--line);padding-left:8px"':'')+'><div class="h"><b data-tog="1" lang="en">'+(x.fam?'<span style="opacity:.5">↳ </span>':'')+esc(x.p)+'</b>'+(x.tr?'<i>'+esc(x.tr)+'</i>':'')+'<button class="ins" data-ins="'+id+'" title="İmlecin olduğu yere ekle">＋</button></div>'+(x.fn?'<div class="fn">'+esc(x.fn)+'</div>':'')+
    '<div class="more">'+(x.frame?'<div class="fr" lang="en">'+esc(x.frame)+'</div>':'')+(x.before||x.after?'<div class="cell">'+(x.before?'<b>Öncesinde</b>'+esc(x.before):'')+(x.after?'<b>Sonrasında</b>'+esc(x.after):'')+'</div>':'')+
    x.ex.map(function(e,k){return'<div class="ex" lang="en">'+esc(e.s)+'<small>'+esc(e.src)+' · <button class="lk" data-cp="'+id+':'+k+'">kopyala</button></small></div>';}).join("")+(x.alts&&x.alts.length?'<div class="cell"><b>Alternatifler</b>'+x.alts.map(esc).join(" · ")+'</div>':'')+'</div></div>';}).join("")||'<div class="empty">Eşleşen ifade yok.</div>';
  $("bhint").innerHTML=B.list.length+" ifade · "+srcLine(B,"baglam");
}
/* --- Dal görünümü --- */
