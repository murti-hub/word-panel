<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alev</title>
<script>
/* Word paneli eski sürümü önbellekte tutmasın: sürüm farklıysa yeni adresle yeniden yükle */
var ALEV_VER="13";
(function(){try{fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(v){v=String(v||"").trim();
  if(v&&v!==ALEV_VER&&String(location.search).indexOf("v="+encodeURIComponent(v))<0){location.replace(location.pathname+"?v="+encodeURIComponent(v)+"&t="+Date.now());}}).catch(function(){});}catch(e){}})();
</script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#FBF7F2;--paper:#FFFFFF;--ink:#231A14;--soft:#7A6A5E;--line:#EADFD3;--acc:#E8590C;--gold:#F59F00;--ok:#2F7D3A}
@media (prefers-color-scheme:dark){:root{--bg:#1A1512;--paper:#241D18;--ink:#F3EAE2;--soft:#B2A294;--line:#3A2F27;--acc:#FF8A3D;--gold:#FFC53D;--ok:#7CCB86}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
.w{padding:14px 14px 20px;max-width:420px;margin:0 auto}
.stage{position:relative;height:210px;display:flex;align-items:flex-end;justify-content:center}
.fl{width:150px;height:190px;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s}
.fl .f1{animation:fk1 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.fl .f2{animation:fk2 .8s ease-in-out infinite alternate;transform-origin:50% 100%}
.fl .f3{animation:fk1 .6s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fk1{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(1.03,.96) skewX(2deg)}100%{transform:scale(.97,1.05) skewX(-2deg)}}
@keyframes fk2{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.05,.94) skewX(3deg)}}
.cold .fl{filter:grayscale(.85) opacity(.5)}
.cold .fl .f1,.cold .fl .f2,.cold .fl .f3{animation-play-state:paused}
.combo{position:absolute;left:0;right:0;bottom:22px;text-align:center;pointer-events:none}
.combo b{display:block;font:800 40px/1 -apple-system,system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(120,30,0,.55)}
.combo span{font:800 10.5px/1 -apple-system,system-ui,sans-serif;letter-spacing:.2em;color:#fff;text-shadow:0 1px 4px rgba(120,30,0,.6)}
.cold .combo b,.cold .combo span{color:var(--soft);text-shadow:none}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.msg{min-height:44px;text-align:center;font:700 16px/1.35 Georgia,serif;margin:6px 4px 4px;color:var(--ink)}
.msg.flash{animation:fade .5s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .9s linear}
.tl{font-size:11.5px;color:var(--soft);text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.c{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.c .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.c .v{font:800 22px/1.2 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.c .s{font-size:12px;color:var(--soft)}
.c.wide{grid-column:1/3}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.bar.done i{background:var(--ok)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--soft)}
.foot button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.set{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;display:none;gap:8px;flex-direction:column}
.set.on{display:flex}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.set input,.set select{width:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;font-size:13px}
.err{background:#FFF1E6;color:#8A3B00;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}
@media (prefers-color-scheme:dark){.err{background:#3A2312;color:#FFC59A}}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:99px;padding:6px 8px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view{display:none}.view.on{display:block}
.pad{padding:12px 12px 24px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--soft);font-size:13px}
.empty b{display:block;color:var(--ink);font:700 16px Georgia,serif;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.q{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:99px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ph .h{display:flex;align-items:baseline;gap:6px}
.ph .h b{font:600 15.5px Georgia,serif;cursor:pointer;flex:1;min-width:0}
.ph .h i{font-style:normal;color:var(--soft);font-size:12px}
.ph .fn{font-size:12.5px;color:var(--soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph.open .fn{display:block}
.ph .more{display:none;margin-top:6px;font-size:12.5px}.ph.open .more{display:block}
.ph .ex{font:13px/1.45 Georgia,serif;border-left:3px solid var(--gold);padding:3px 8px;margin:5px 0;background:var(--bg);border-radius:0 6px 6px 0}
.ph .ex small{display:block;font:11px -apple-system,system-ui,sans-serif;color:var(--soft)}
.ph .fr{font:italic 13px Georgia,serif;background:var(--bg);border-radius:6px;padding:3px 7px;margin:4px 0}
.ins{border:0;background:var(--acc);color:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none}
.lk{border:0;background:none;color:var(--acc);font-size:11.5px;font-weight:700;cursor:pointer;padding:0}
.sel{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:6px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:13.5px/1.5 Georgia,serif;white-space:pre-wrap}
.qt{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.qt p{margin:0;font:13.5px/1.5 Georgia,serif}
.qt .m{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--soft)}
.qt .m span{flex:1;min-width:0}
.cell{font-size:12.5px;margin-top:4px}.cell b{display:block;font-size:11px;color:var(--soft)}
.hint{font-size:11.5px;color:var(--soft);margin-top:10px}
.path{font-size:12px;color:var(--soft);margin-bottom:4px}
.kids{display:flex;flex-wrap:wrap;gap:5px}
.kids button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;text-align:left}
.gbar{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--soft);border-bottom:1px solid var(--line);background:var(--bg)}
.gbar span{flex:1;min-width:0}
.gbar .btn{padding:3px 8px;font-size:11.5px}
.gbar.hide{display:none}
.hv{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.hv .t{font:13.5px/1.5 Georgia,serif;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.hv.open .t{display:block}
.hv .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--soft)}
.hv .m .no{font-weight:800;color:var(--acc)}
.hv .m .sp{flex:1}
.hv.done{opacity:.6}
.ph .h{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;row-gap:1px;align-items:start}
.ph .h b{grid-column:1;overflow-wrap:anywhere}
.ph .h i{grid-column:1;grid-row:2;font-size:12px;line-height:1.35}
.ph .h .ins{grid-column:2;grid-row:1 / span 2;align-self:start}
.tabs{gap:3px;padding:6px 6px}
.tabs button{padding:5px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qt .m{flex-wrap:wrap}
.hv .t,.qt p,.note,.ph .ex{overflow-wrap:anywhere}
@media (max-width:300px){
  body{font-size:13px}
  .pad{padding:10px 8px 20px}
  .tabs button{font-size:11px}
  .ph .h b{font-size:14px}
  .ph .fn,.cell,.hv .m,.qt .m{font-size:11.5px}
  .hv .t,.qt p,.note{font-size:12.5px}
  .c .v{font-size:19px}.c{padding:8px 9px}
  .stage{height:180px}.fl{width:125px;height:160px}
  .gbar{padding:5px 8px}
}
.hv .th{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;margin-top:6px}
.hv .th img{width:100%;height:70px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.hv .th img:only-child{height:auto;max-height:180px}
.thx{font-size:11.5px;color:var(--soft)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:10px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:6px}
#lb button{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#111;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<nav class="tabs" id="tabs"><button data-v="alev" aria-pressed="true">🔥 Alev</button><button data-v="baglam" aria-pressed="false">Bağlam</button><button data-v="dal" aria-pressed="false">Dal</button><button data-v="havuz" aria-pressed="false">Havuz</button></nav>
<div class="gbar" id="gbar"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<section class="view pad" id="v-baglam"></section>
<section class="view pad" id="v-dal"></section>
<section class="view pad" id="v-havuz"></section>
<section class="view on" id="v-alev">
<div class="w cold" id="w">
  <div class="stage">
    <svg class="fl" id="fl" viewBox="0 0 150 190" aria-hidden="true">
      <defs>
        <radialGradient id="g1" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#E8590C"/></radialGradient>
        <radialGradient id="g2" cx="50%" cy="85%" r="70%"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FAB005"/></radialGradient>
        <radialGradient id="g3" cx="50%" cy="85%" r="70%"><stop offset="0" stop-color="#FFFFFF" id="c3a"/><stop offset="1" stop-color="#FFF3BF" id="c3b"/></radialGradient>
      </defs>
      <path class="f1" fill="url(#g1)" d="M75 4 C95 40 132 70 132 118 C132 160 106 186 75 186 C44 186 18 160 18 118 C18 86 40 70 52 46 C56 66 62 76 70 82 C70 54 66 30 75 4 Z"/>
      <path class="f2" fill="url(#g2)" d="M75 58 C90 84 112 104 112 134 C112 164 95 182 75 182 C55 182 38 164 38 134 C38 112 52 98 60 84 C64 98 68 104 74 108 C72 90 70 76 75 58 Z"/>
      <path class="f3" fill="url(#g3)" d="M75 112 C84 126 94 138 94 154 C94 170 86 180 75 180 C64 180 56 170 56 154 C56 140 66 128 75 112 Z"/>
    </svg>
    <div class="combo" id="combo"><b id="cn">0</b><span>KOMBO</span></div>
  </div>
  <div class="msg" id="msg">Yazmaya başla, alev yansın.</div>
  <div class="timer"><i id="tb" style="width:0"></i></div>
  <div class="tl" id="tl">Her bitirdiğin cümle komboyu büyütür.</div>
  <div class="cards">
    <div class="c"><div class="k">Bu oturum</div><div class="v" id="sw">0</div><div class="s" id="ss">kelime · 0 cümle</div></div>
    <div class="c"><div class="k">Seri</div><div class="v" id="st">0</div><div class="s" id="sts">gün</div></div>
    <div class="c wide"><div class="k">Bugün</div><div class="v" id="tw">0 <small style="font-size:13px;font-weight:600;color:var(--soft)" id="tg">/ 300</small></div><div class="bar" id="tbar"><i id="tbi" style="width:0"></i></div></div>
    <div class="c"><div class="k">En iyi kombo</div><div class="v" id="bc">0</div><div class="s" id="bcs">cümle</div></div>
    <div class="c"><div class="k">Belge</div><div class="v" id="dw">–</div><div class="s">kelime</div></div>
  </div>
  <div class="err" id="err"></div>
  <div class="foot"><span id="st2">Bekleniyor…</span><span style="opacity:.5">s13</span><button id="sb">Ayarlar</button></div>
  <div class="set" id="set">
    <label>Günlük hedef (kelime) <input type="number" id="goal" min="50" step="50"></label>
    <label>Kombo süresi <select id="win"><option value="120">2 dk</option><option value="300">5 dk</option><option value="600">10 dk</option><option value="900">15 dk</option><option value="1200">20 dk</option></select></label>
    <label>Bugünü sıfırla <button id="rst" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 8px">Sıfırla</button></label>
  </div>
</div>
</section>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var KEY="alev-word-v1", S={days:{},goal:300,win:600,best:0};
try{var o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)S=Object.assign(S,o);}catch(e){}
if(!S.winV2){if(S.win<120)S.win=600;S.winV2=1;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function day(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var combo=0,sessW=0,sessS=0,last=0,prev=null,lastMsgAt=0,running=false;
function wc(t){var m=String(t||"").match(/[^\s​]+/g);return m?m.length:0;}
function sents(t){var m=String(t||"").match(/[^.!?…]+[.!?…]+["'”’)\]]*(?=\s|$)/g)||[];return m.filter(function(x){return wc(x)>=4;}).length;}
function same(a,b){if(!a||!b)return !a&&wc(b)<=20||!b&&wc(a)<=20;var k=Math.min(18,a.length,b.length);return k>0&&a.slice(0,k)===b.slice(0,k);}
function streak(){var n=0,d=new Date();if((S.days[day(d)]||0)<S.goal)d.setDate(d.getDate()-1);for(var i=0;i<3650;i++){if((S.days[day(d)]||0)>=S.goal){n++;d.setDate(d.getDate()-1);}else break;}return n;}
var MS={1:"Başladın 🔥",3:"Isınıyorsun…",5:"5 cümle üst üste! İyi gidiyorsun",8:"Akış geldi, bırakma",10:"Kombo x10! Durma 🔥",15:"Harika ritim, x15",20:"Mavi alev! x20 💙",25:"Bu iş oluyor, x25",30:"Efsane! x30"};
var SMALL=["Bir cümle daha ✓","Güzel","Devam","Akıyor","Tamam, sıradaki","İyi","Bir tane daha"];
function say(t){var m=$("msg");m.textContent=t;m.classList.remove("flash");void m.offsetWidth;m.classList.add("flash");lastMsgAt=Date.now();}
function bump(){var c=$("cn");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");}
function onSentence(){combo++;sessS++;bump();if(MS[combo])say(MS[combo]);else if(combo>30&&combo%10===0)say("x"+combo+"! İnanılmaz seri");else if(Date.now()-lastMsgAt>8000)say(SMALL[Math.floor(Math.random()*SMALL.length)]);if(combo>S.best){S.best=combo;save();}}
function onWords(n){sessW+=n;var k=day();var before=S.days[k]||0;S.days[k]=before+n;if(before<S.goal&&S.days[k]>=S.goal)say("Günlük hedef tamam! 🎉 "+S.goal+" kelime");save();}
function endCombo(){if(combo>=3)say("Kombo bitti: x"+combo+(combo>=S.best?" · rekor!":"")+". Yeni cümleyle yeniden yak.");else if(combo>0)say("Alev söndü, bir cümleyle yeniden yak.");combo=0;}
function paint(){
  var now=Date.now(),left=last?Math.max(0,S.win*1000-(now-last)):0;
  if(combo>0&&last&&left===0)endCombo();
  var heat=combo?Math.min(1,0.25+combo/20):0;
  $("w").classList.toggle("cold",!combo);
  $("fl").style.transform="scale("+(0.55+heat*0.55).toFixed(3)+")";
  var blue=combo>=20;$("c3a").setAttribute("stop-color",blue?"#E7F5FF":"#FFFFFF");$("c3b").setAttribute("stop-color",blue?"#74C0FC":"#FFF3BF");
  $("cn").textContent=combo?"x"+combo:"0";
  $("tb").style.width=(combo?left/(S.win*1000)*100:0)+"%";
  $("tl").textContent=combo?"Kombo "+(function(x){var m=Math.floor(x/60),sec=x%60;return m?m+" dk "+(sec<10?"0":"")+sec+" sn":sec+" sn";})(Math.ceil(left/1000))+" içinde yeni cümle bekliyor":"Her bitirdiğin cümle komboyu büyütür.";
  $("sw").textContent=sessW;$("ss").textContent="kelime · "+sessS+" cümle";
  var t=S.days[day()]||0;$("tw").firstChild.nodeValue=t+" ";$("tg").textContent="/ "+S.goal;$("tbi").style.width=Math.min(100,t/S.goal*100)+"%";$("tbar").classList.toggle("done",t>=S.goal);
  var s=streak();$("st").textContent=s;$("sts").textContent=s?"gün üst üste hedef 🔥":"gün · hedefi tuttur, seri başlasın";
  $("bc").textContent=S.best;
}
function handle(text){
  var w=wc(text),s=sents(text),now=Date.now();
  if(prev&&same(prev.t,text)){
    var dw=w-prev.w,ds=s-prev.s;
    if(dw>60){say("Yapıştırma sayılmadı 🙂");}
    else{ if(dw>0){onWords(dw);last=now;} if(ds>0&&dw>0){for(var i=0;i<Math.min(ds,3);i++)onSentence();last=now;} }
  }
  prev={t:text,w:w,s:s};
}
function poll(){
  if(running)return;running=true;
  Word.run(function(ctx){var p=ctx.document.getSelection().paragraphs.getFirstOrNullObject();p.load("text");return ctx.sync().then(function(){if(!p.isNullObject)handle(p.text);});})
    .then(function(){running=false;$("err").style.display="none";$("st2").textContent="Yazdıklarını izliyor · metin hiçbir yere gönderilmez";},function(e){running=false;$("st2").textContent="Belge okunamadı";});
}
function docCount(){Word.run(function(ctx){var b=ctx.document.body;b.load("text");return ctx.sync().then(function(){$("dw").textContent=wc(b.text).toLocaleString("tr-TR");});}).catch(function(){});}
$("sb").onclick=function(){var s=$("set");s.classList.toggle("on");$("goal").value=S.goal;$("win").value=String(S.win);};
$("goal").onchange=function(){var v=parseInt(this.value,10);if(v>=50){S.goal=v;save();paint();}};
$("win").onchange=function(){S.win=parseInt(this.value,10)||600;save();paint();};
$("rst").onclick=function(){S.days[day()]=0;save();paint();};
setInterval(paint,1000);paint();
Office.onReady(function(info){
  if(info.host!==Office.HostType.Word){$("err").style.display="block";$("err").textContent="Bu panel Word içinde çalışır.";return;}
  if(!Office.context.requirements.isSetSupported("WordApi","1.3")){$("err").style.display="block";$("err").textContent="Word sürümün bu paneli desteklemiyor; Word'ü güncelle.";return;}
